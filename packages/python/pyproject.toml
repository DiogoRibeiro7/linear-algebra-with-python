[tool.poetry]
name = "linear-algebra-with-python"
version = "0.1.0"
description = "Practical assignments for Linear Algebra and Analytic Geometry — TSIW, ESMAD/IPP"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/diogoribeiro7/linear-algebra-with-python"
packages = [{ include = "linalg_utils", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
matplotlib = ">=3.8"
scipy = ">=1.12"
jupyter = ">=1.0"
nbformat = ">=5.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"
mypy = ">=1.10"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
