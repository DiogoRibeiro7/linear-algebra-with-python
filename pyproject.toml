[tool.poetry]
name = "linear-algebra-with-python"
version = "0.1.0"
description = "Teach linear algebra with Python, NumPy, and visual intuition."
authors = ["Diogo <you@example.com>"]
readme = "README.md"
packages = [{ include = "linalg_with_python", from = "src" }]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26"
matplotlib = ">=3.8"
sympy = { version = ">=1.12", optional = true }

[tool.poetry.extras]
symbolic = ["sympy"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
ruff = ">=0.2"
mypy = ">=1.7"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
